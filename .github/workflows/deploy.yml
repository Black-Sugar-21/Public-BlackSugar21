# Despliegue MANUAL de Public-BlackSugar21 (sitio público blacksugar21.com (Firebase Hosting)).
# Regla del dueño: ningún workflow se dispara solo (solo workflow_dispatch). No lo corre ningún agente: lo corre el dueño.
#   gh workflow run deploy.yml -R <org>/Public-BlackSugar21 -f confirm=Public-BlackSugar21 [-f target=...]
# Pide escribir el nombre de la app, despliega solo desde main, corre las pruebas antes y NUNCA usa --force.
# Llave de la cuenta de servicio: secreto FIREBASE_SERVICE_ACCOUNT_BLACK_SUGAR_21 (docs/ci-secrets.es.md de Bimbask-Inc/bimbask-ci).
# Reemplaza al deploy.yml anterior (FirebaseExtended/action-hosting-deploy sin fijar, Node 18, sin confirmación). Usa el secreto que el repo ya tiene.
name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe Public-BlackSugar21 para confirmar el despliegue'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirmación
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Solo desde main
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Se despliega solo desde main (ref: $REF)"; exit 1; }
      - name: Nombre de la app
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "Public-BlackSugar21" ] || { echo "::error::Confirmación incorrecta: escribe exactamente Public-BlackSugar21"; exit 1; }

  ci:
    name: Pruebas, cobertura y seguridad
    needs: confirm
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Firebase · black-sugar21
    needs: [confirm, ci]
    permissions:
      contents: read
      id-token: write   # acceso sin llaves (Workload Identity)
    uses: Bimbask-Inc/bimbask-ci/.github/workflows/firebase-deploy.yml@v1.5.1
    with:
      gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      firebase_project: black-sugar21
      only: hosting
      node_version: '22'
      install_command: 'npm ci'
      build_command: 'npm run build:prod'
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLACK_SUGAR_21 }}
