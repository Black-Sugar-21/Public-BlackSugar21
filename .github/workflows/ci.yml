name: CI — Backend Tests

on:
  # Sólo manual (dueño 2026-09-29): ningún workflow se dispara solo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend offline test suite (~990 assertions, 6 files)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # prevents hung tests from pinning the runner indefinitely (c8 adds overhead)
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run offline test suite with coverage (c8, ISC)
        run: npx --yes c8@10.1.3 --all --src . --include 'lib/**' --include 'index.js' --exclude 'test-*.js' --reporter=lcov --reporter=text-summary npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-functions
          path: functions/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error
        # Pure static-analysis tests across 4 files:
        #   - test-comprehensive-300.js   (333 asserts — regex, sanitization,
        #                                    guards, clamping, i18n, safety)
        #   - test-post-deploy-350.js     (394 asserts — code patterns,
        #                                    RAG/Coach/Moderation/Places config)
        #   - test-discovery-v2-parity.js (111 asserts — orientation, userType,
        #                                    reviewer bypass, gender_mismatch,
        #                                    super-like, real-data simulation)
        #   - test-situation-sim.js       (27 asserts — 10-language directives,
        #                                    edge cases, XSS/SQL/RTL handling)
        #
        # All read lib/*.js with fs.readFileSync + regex checks — no Firebase
        # Admin SDK or Gemini API init, so the job needs zero secrets and
        # runs in < 15 seconds. Exit code 1 on any failure blocks merge.

      - name: Report test summary
        if: always()
        run: |
          echo "## Backend Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: $?" >> $GITHUB_STEP_SUMMARY

  web-tests:
    name: Web Angular · unit tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit tests with coverage
        run: npx ng test --no-watch --coverage --coverage-reporters lcov --coverage-reporters text-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-web
          path: coverage/**/lcov.info
          retention-days: 7
          if-no-files-found: error

  coverage-functions:
    name: Cobertura · Public functions (c8)
    needs: backend-tests
    if: ${{ !cancelled() && needs.backend-tests.result != 'skipped' }}
    uses: Bimbask-Inc/bimbask-ci/.github/workflows/coverage-gate.yml@v1.3.0
    with:
      artifact_name: coverage-functions
      report_file: lcov.info
      format: auto
      minimum: 95
      declared_minimum: 0
      label: "Public functions (c8)"

  coverage-web:
    name: Cobertura · Public web (Angular)
    needs: web-tests
    if: ${{ !cancelled() && needs.web-tests.result != 'skipped' }}
    uses: Bimbask-Inc/bimbask-ci/.github/workflows/coverage-gate.yml@v1.3.0
    with:
      artifact_name: coverage-web
      report_file: lcov.info
      format: auto
      minimum: 95
      declared_minimum: 0
      label: "Public web (Angular)"

  security:
    name: Seguridad
    permissions:
      contents: read
      security-events: write
    uses: Bimbask-Inc/bimbask-ci/.github/workflows/security.yml@v1.3.0
    with:
      codeql: true
      codeql_languages: javascript-typescript
